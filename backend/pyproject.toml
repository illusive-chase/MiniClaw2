[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miniclaw2"
version = "0.1.0"
description = "Minimal Claude Code SDK wrapper with a FastAPI + WebSocket gateway"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.scripts]
miniclaw2 = "miniclaw2.__main__:main"

[tool.setuptools]
packages = [
    "miniclaw2",
    "miniclaw2.providers",
    "miniclaw2.scenarios",
]

[tool.setuptools.package-data]
"miniclaw2" = [
    "prompts/*.md",
]
"miniclaw2.scenarios" = [
    "bundled/*/scenario.yaml",
    "bundled/*/brief.md",
    "bundled/*/acceptance.md",
    "bundled/*/contract.md",
    "bundled/*/verify.sh",
    "bundled/*/prompts/*.md",
    "bundled/*/seed/**/*",
]
