[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miniclaw2"
version = "0.1.0"
description = "Native Claude Code CLI driver with a FastAPI + WebSocket gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "ptyprocess>=0.7",
]

[project.optional-dependencies]
test = [
    "httpx2>=2.0",
    "pytest>=8.0",
]

[project.scripts]
miniclaw2 = "miniclaw2.__main__:main"

[tool.setuptools]
packages = [
    "miniclaw2",
    "miniclaw2.providers",
    "miniclaw2.providers.claude_native",
    "miniclaw2.templates",
]

[tool.setuptools.package-data]
"miniclaw2" = [
    "default_config.json",
    "prompts/*.md",
]
"miniclaw2.templates" = [
    "bundled/*/template.yaml",
    "bundled/*/lane.yaml",
    "bundled/*/prompts/*.md",
    "bundled/*/scripts/*.sh",
    "bundled/*/seed/**/*",
]
