nodes:
- id: turn1
  kind: agent
  prompt_file: prompts/turn1.md
- id: verify
  kind: verifier
  script_ref: scripts/verify.sh
  scheduled_deps:
  - turn1
  brief:
    check_what: Run the bundled programmatic verifier for this template.
    expected: verify.sh exits 0.
    abnormal: verify.sh exits non-zero, times out, or reports missing expected artifacts.
- id: accept
  kind: agent
  category: review
  subtype: human_interact_review
  scheduled_deps:
  - turn1
  - verify
  prompt_file: prompts/accept.md
  brief:
    check_what: "- A permission prompt appeared in the gate tab asking to run the\
      \ Bash command (you had to click Allow \u2014 it did not auto-run).\n- After\
      \ you approved, a Bash tool tile appeared in the timeline and its output shows\
      \ the literal string `hello-from-bash`.\n- The assistant's sentence accurately\
      \ reports what was printed (not a hallucinated value, not a refusal)."
    expected: All acceptance bullets hold.
    abnormal: Any acceptance bullet fails; describe which one and how.
