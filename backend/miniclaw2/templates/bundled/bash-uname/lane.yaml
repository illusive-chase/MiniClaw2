nodes:
- id: turn1
  kind: agent
  prompt_file: prompts/turn1.md
- id: verify
  kind: verifier
  script_ref: scripts/verify.sh
  scheduled_deps:
  - turn1
  brief:
    check_what: Run the bundled programmatic verifier for this template.
    expected: verify.sh exits 0.
    abnormal: verify.sh exits non-zero, times out, or reports missing expected artifacts.
- id: accept
  kind: agent
  category: review
  subtype: human_interact_review
  scheduled_deps:
  - turn1
  - verify
  prompt_file: prompts/accept.md
  brief:
    check_what: "- Expanding the Bash tool tile shows a real `uname -a` output (a\
      \ path-like string mentioning Darwin, Linux, or another Unix variant \u2014\
      \ not a stub or hallucination).\n- The assistant's sentence is consistent with\
      \ that output (does not claim Linux when the output says Darwin, or vice versa).\n\
      - Only one Bash tool activity appears in the timeline."
    expected: All acceptance bullets hold.
    abnormal: Any acceptance bullet fails; describe which one and how.
