name: resume-fix-after-reject
brief: "Resume edge: build → review → fix step resumes the build's session."
providers: [claude, codex]
auto_commit: true
permission_mode: bypassPermissions
nodes:
  - id: build
    kind: agent
    prompt_file: prompts/build.md
  - id: review
    kind: agent
    category: review
    subtype: human_interact_review
    review_source: build
    prompt_file: prompts/review.md
    brief:
      check_what: "Inspect mathutils.py after the build step and decide whether it should add subtract(a, b)."
      expected: "mathutils.py currently exports add(a, b); the human reviewer can request subtract(a, b) as follow-up work."
      abnormal: "mathutils.py is missing, add(a, b) is wrong, or the module already contains extra functions before review."
  - id: fix
    kind: agent
    resume_from: build
    prompt_file: prompts/fix.md
