name: gui-calculator
brief: "Build a PySide6 Qt calculator, then review it via a human-interact review agent."
providers: [claude, codex]
auto_commit: true
nodes:
  - id: build
    kind: agent
    prompt_file: prompts/build.md
  - id: review
    kind: agent
    category: review
    subtype: human_interact_review
    review_source: build
    prompt_file: prompts/review.md
    brief:
      check_what: "Run/import the generated calculator and inspect the GUI behavior named by the build prompt."
      expected: "calculator.py imports without opening a window, requirements.txt names PySide6, and running calculator.py opens a usable Calculator window with digits, operators, equals, clear, and divide-by-zero handling."
      abnormal: "Top-level PySide6 import blocks importability, tkinter is used, missing requirements.txt, the window cannot launch, or basic button/error behavior is broken."
